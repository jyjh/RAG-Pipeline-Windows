[paths]
data_dir = "data"
processed_dir = "processed_docs"
db_dir = "db"
asset_dir = "db/assets"

[models]
# Chat (gemma4:26b) and vision (qwen3-vl:32b) run on the hosted SoCLAaS API
# (https://soclaas-api.comp.nus.edu.sg; see [llm_api]). Embeddings default to
# a locally hosted all-minilm via Ollama; see [embeddings].backend.
llm_model = "gemma4:26b"
# Chat/planner model for the LOCAL Ollama fallback (backend = "ollama", or a
# missing API key). qwen3:4b-instruct (~2.5 GB at Q4_K_M, native tool-calling)
# fits a 4 GB GPU; without this pin, base-name matching would substitute the
# cloud tag with gemma4:latest (gemma4 e4b, 9.6 GB) and thrash small GPUs.
local_llm_model = "qwen3:4b-instruct"
vision_model = "qwen3-vl:32b"
# Local substitute when the cloud is unavailable (4 GB GPU-friendly).
local_vision_model = "qwen2.5vl:3b"
embedding_model = "all-minilm"
reranker_model = ""
# all-minilm dense dim. Changing model/dim invalidates an existing index
# (a full re-index is required); the indexer's model+dim reuse guard enforces it.
embedding_dim = 384

[ingestion]
ocr_backend = "rapidocr"
ocr_langs = ["english"]
ocr_force_full_page = true
ocr_bitmap_area_threshold = 0.05
rapidocr_backend = "onnxruntime"
tesseract_cmd = "tesseract"
tesseract_data_path = ""
tesseract_psm = 3
vision_enabled = true
code_enrichment = false
formula_enrichment = true
accelerator = "auto"
num_threads = 8
asset_triggers = "auto"
# Number of parallel worker processes for PDF ingestion. Each worker loads its
# own copy of the Docling/OCR models, so this trades throughput for VRAM. 1 =
# serial (safe default). Set to 2-4 on a GPU with headroom for a large corpus.
ingestion_workers = 1
# Above this page count, Docling parsing switches to a page-at-a-time path to
# bound memory (the whole-document path materializes the full Docling model +
# OCR state in RAM and OOMs on a multi-thousand-page scanned book). 0 = never
# force (always use the whole-document path when progress is disabled).
max_pages_whole_doc = 50
# Estimated on-disk expansion when PDFs become Markdown + .pages.json sidecars.
# Used by the ingest disk-space pre-check. Born-digital ~1.5x; scanned ~2x+.
ingest_expansion_factor = 2.0

# Approximate-nearest-neighbour (ANN) vector index. Below ann_min_rows the
# table uses a flat (brute-force) scan which is faster for small corpora; above
# it, an IVF_PQ index makes every query sublinear. These defaults are tuned
# for all-minilm (384-dim, L2-normalized vectors). Applied at startup via
# src.vector_store.apply_indexing_config so builds and queries honor them.
[indexing]
ann_min_rows = 50000
ann_nprobes = 50
ann_refine_factor = 20
# Fraction of changed rows that triggers an IVF_PQ retrain during incremental
# reindex. Below it, stale centroids are retained (graceful recall degradation).
ann_retrain_threshold = 0.01

# Embedding engine tuning. At corpus scale this is THE bottleneck: a 100GB
# cold index is weeks of embedding work on a single Ollama host. The levers
# below are surfaced in config (with env-var overrides OLLAMA_EMBED_* for
# ad-hoc use). Precedence: constructor arg > env var > these values > defaults.
[embeddings]
# Embedding transport, chosen INDEPENDENTLY of chat/vision so the default
# split deployment works: SoCLAaS gemma4/qwen3-vl inference with locally
# hosted all-minilm embeddings. "ollama" (default) = the local Ollama
# host(s) below / OLLAMA_HOST; "soclaas" = the hosted API's bge-m3 (1024-d --
# pair it with [models] embedding_model = "bge-m3", embedding_dim = 1024 and
# re-index); "" = follow [llm_api].backend. Env EMBEDDINGS_BACKEND overrides.
# ([models].native_embeddings = true still takes precedence over both.)
backend = "ollama"
# Native SentenceTransformers (GPU/CPU) is typically 2-5x faster than the
# Ollama HTTP path for a one-time cold index. Use it for the initial build,
# then switch back to Ollama (native_embeddings = false) for steady-state
# incremental updates. Set in [models].native_embeddings instead.
# Embedding batch size. Larger = better GPU utilization but more memory.
# 64 is stable for all-minilm with long RAG chunks on a 4 GB GPU.
batch_size = 64
# Per-request timeout. The effective timeout scales with batch size (see
# timeout_batch_baseline / timeout_max_seconds) so a large batch on a slow GPU
# does not silently trip the retry loop.
timeout_seconds = 30.0
timeout_batch_baseline = 128
timeout_max_seconds = 600.0
# Bounded retry with exponential backoff for transient Ollama hiccups.
retries = 3
# Embedding LRU cache size (~150MB at 50k entries x 768 float32). Bounds RAM
# during a 100GB-scale cold index where nearly every chunk is unique.
cache_max_entries = 50000
# Multi-host embedding: list Ollama replica URLs to shard batches across.
# This is the PRIMARY scale-out lever -- N replicas ~= N x throughput.
# Empty = single host via OLLAMA_HOST. Example:
#   hosts = ["http://gpu-a:11434", "http://gpu-b:11434"]
hosts = []
# In-flight batches per host. Set >1 when the Ollama server runs with
# OLLAMA_NUM_PARALLEL>1. 1 = one batch per host at a time.
concurrency = 1

[uploads]
# Per-file and per-corpus size caps in bytes (0 = unlimited). Set these on a
# shared deployment to prevent one upload from exhausting disk.
max_upload_bytes = 0
max_corpus_bytes = 0
# Chunk size for the resumable chunked-upload endpoint (large single files).
chunk_bytes = 16777216

[retrieval]
min_relevance_score = 0.50
relative_relevance_cutoff = 0.72
candidate_top_k = 80
context_token_fraction = 0.60

[web_search]
# Provider is DuckDuckGo Lite, built in; there is no provider key to set.
enabled = true
timeout_seconds = 8.0
max_results = 5

# LLM source-group auto-tagging (src/auto_tag.py). PDFs uploaded without a
# manual source group are classified in the background by the chat model and
# land in the trust registry exactly like manual tags, but carry an
# auto_tagged flag (model, confidence, reason, timestamp) so reviewers can
# audit them; any manual tag clears the flag.
[auto_tag]
enabled = true
# Empty = [models].llm_model (gemma4:26b).
model = ""
# Documents per classification request.
batch_size = 20
# Decisions below this confidence are dropped and the PDF stays ungrouped.
min_confidence = 0.6
# First-page text budget per PDF (filename-only classification when 0).
excerpt_chars = 1200
timeout_seconds = 120.0
# Cap per auto-tag run so one click cannot enqueue the whole corpus.
max_items_per_run = 200

# Hosted OpenAI-compatible LLM API (SoCLAaS). This is the PRIMARY backend for
# chat (gemma4:26b) and vision (qwen3-vl:32b, via chat-completions image
# parts). Embeddings have their own selector -- [embeddings].backend above --
# and default to a locally hosted all-minilm. Set backend = "ollama"
# here to fall back to a local Ollama server for fully-offline chat/vision
# (the Ollama transport stays in the tree for that).
[llm_api]
# Cloud-unavailable fallback: when backend = "soclaas" but no API key is
# resolvable, the effective backend automatically becomes the local Ollama
# below (chat and vision), and cloud-named models are substituted with the
# configured local tags ([models].local_llm_model, default qwen3:4b-instruct;
# local_vision_model, default qwen2.5vl). Set env LLM_STRICT_BACKEND=1 to
# disable the fallback and fail loudly instead.
backend = "soclaas"
base_url = "https://soclaas-api.comp.nus.edu.sg"
api_key = ""
# The key is read from api_key above, but the env var named in key_env
# (default SOCLAAS_API_KEY; LLM_API_KEY is also honored) overrides it, so a
# secret need not live in this file.
chat_path = "/v1/chat/completions"
embeddings_path = "/v1/embeddings"
models_path = "/v1/models"
request_timeout_seconds = 120.0
retries = 3

# DORMANT FALLBACK: only used when [llm_api].backend = "ollama". Points the
# chat/vision transports at a local Ollama server for offline runs. (Embedding
# host(s) are configured separately under [embeddings].hosts.)
[ollama]
host = "http://127.0.0.1:11434"
hosts = []
fallback_enabled = true
chat_health_check_interval_seconds = 5.0
chat_max_lost_health_checks = 5

[chat]
context_window = 8192
llm_num_predict = 4096
# Sampling knobs (llm_timeout is a deprecated compatibility key; the SoCLAaS
# path uses [llm_api].request_timeout_seconds).
temperature = 0.3
max_k = 40
llm_timeout = 120.0
# Ollama-only: how long the local server keeps the chat model resident between
# requests. Ollama's own default (5m) unloads the model, and a cold reload on
# a small GPU costs minutes. "" = the Ollama server default.
ollama_keep_alive = "30m"
# SoCLAaS exposes only three models, so the planner reuses the main chat model.
planner_model = "gemma4:26b"
planner_enabled = true
planner_max_queries = 3
system_prompt = """You are a retrieval-augmented assistant. Before answering, you must call search_local_context at least once. You may call search_local_context again with a narrower query when more evidence is needed. {web_instruction} Use only information returned by tools. In the final answer, cite every factual claim with source IDs exactly as provided, such as [S1] or [W1]. If the available sources are insufficient, say what is missing."""

[server]
host = "127.0.0.1"
port = 8000
bind_all = false
api_token = ""
update_remote = "origin"
update_branch = "main"
health_poll_interval_ms = 60000
jobs_poll_interval_ms = 60000
background_worker_threads = 2
# Multiplier applied to the estimated peak disk footprint of an index build
# (staged index + publish backup + corpus) before the pre-build disk-space
# check refuses to start. 1.15 = 15% headroom.
disk_safety_factor = 1.15
# Number of parallel job-worker threads. 1 = serial (safe default). With >1,
# ingestion-only phases of different upload jobs run concurrently; index-mutating
# phases (indexing, backup, restore, rebuild) are serialized internally so only
# one writes to db/ at a time. Each ingestion worker loads its own parser models.
job_workers = 1
# Max seconds an index-mutating job (indexing/backup/restore/rebuild) will pause
# and wait for active chats/queries to finish before aborting. Index jobs wait for
# in-flight queries so a rebuild doesn't swap the index out from under a running
# chat. Without a cap, a leaked query counter (e.g. a chat stream whose cleanup
# never ran after a client disconnect + hung model) would block ALL index work
# forever. The job fails loudly instead; 1800s (30 min) is generous for a long
# but legitimate generation. Set to 0 to disable the watchdog (not recommended).
query_wait_timeout_seconds = 1800

# Per-user API-key auth, rate limiting, and usage tracking. Layers on top of the
# single shared [server] api_token above, which stays available as an admin/
# owner master bypass. Keys are issued offline by scripts/manage_api_keys.py and
# stored hashed in data/.api_keys.json. INERT BY DEFAULT: until an admin creates
# at least one key (or sets [server] api_token), all requests pass through open.
[api_keys]
enabled = true
# Default requests/minute per key (sliding 60s window). Override per key with
# --rate-limit when issuing a key.
rate_limit_per_minute = 60
# How often (in requests) accumulated usage counters are flushed to disk. The
# hot path only touches in-memory counters, so this bounds disk write frequency.
usage_persist_interval = 50
# Prefix on plaintext key strings, e.g. "rag_..." -- purely a label so admins
# can recognize key material at a glance.
key_prefix = "rag_"

# Optional web-server -> HPC delegation. Run `setup.cmd` on Windows or
# `./setup.sh` on Linux/macOS for the guided configuration and connection test.
# The CPU cluster's role is INGEST-ONLY jobs (--skip-index): it parses/OCRs
# the staged corpus into Markdown; embedding and index construction run on the
# workstation with the local embedding model. Ingest+index remains available
# for clusters that may embed via the SoCLAaS API (EMBEDDINGS_BACKEND=soclaas).
[hpc]
enabled = false
# The setup wizard writes ABSOLUTE paths under /hpctmp/<user>/rag-corpus/ so
# the corpus survives re-provisioning (which atomically replaces the repo
# directory). The relative values below are the legacy repo-relative defaults
# and keep working; `start.cmd --initial-corpus <zip>` stages the corpus for
# you either way.
remote_data_dir = "data"
remote_processed_dir = "processed_docs"
remote_db_dir = "db"
poll_interval_seconds = 15.0

[hpc.cpu]
ssh_host = ""
# Login-relative symlink created by setup; its target lives under
# /hpctmp/<username>/<remote_repo_dir>.
remote_repo_dir = ""
container_sif = "rag_pipeline_cpu.sif"
storage_root = "/hpctmp/${USER}"

[hpc.cpu.pbs_overrides]
ngpus = 0
queue = "cpu"
ncpus = 16
mem = "32gb"
walltime = "12:00:00"
